# Every threshold the rules compare against. No number lives anywhere else —
# G10 scans the rule modules and fails on any float literal.
#
# Each entry carries `value`, `unit`, `source` and `date`. `source` is the one
# that matters and the one most likely to rot: a threshold whose provenance is
# "seemed about right" is a threshold nobody can defend when an athlete disputes
# a verdict, and it is indistinguishable from a tuned one once it is in the file.
#
# STATUS VOCABULARY
#   hypothesis  — a starting guess. NOT yet swept. Rules using one may run in
#                 the eval loop but must not ship enabled to users.
#   tuned       — Loop C swept it against the golden set; `curve` points at the
#                 precision/recall evidence and `date` is when it was chosen.
#   disabled    — swept and no operating point met the bar. The rule ships OFF.
#                 A rule that is wrong a third of the time is worse than absent,
#                 because it teaches people to ignore the ones that are right.
#
# Every value below is `hypothesis`. Loop C has not run — it cannot run until
# rep segmentation and kinematics are green — so nothing here has evidence yet
# and the file says so rather than implying otherwise.
#
# ENABLED IS SEPARATE FROM TUNED. A rule with no fixture in the golden set has
# no labelled positives, so no precision/recall curve exists and no operating
# point can be chosen. Those rules carry `enabled: false` and DO NOT FIRE for
# users. They still run in the eval loop, where a false positive costs nothing
# and is informative. Shipping a rule that is wrong a third of the time teaches
# people to ignore the ones that are right, which is the expensive failure.

version: "2026-09-05"

ingest:
  min_fps:
    value: 24
    unit: fps
    status: hypothesis
    source: >
      Below ~24 fps a 0.9 s concentric is sampled ~20 times, and the peak
      velocity estimate starts depending on where the samples land rather than
      on the lift. Chosen as the floor of usable cinema frame rates.
    date: 2026-09-05
  max_duration_s:
    value: 180
    unit: s
    status: hypothesis
    source: "Product scope: one set. 3 min is a generous ceiling for 15 reps."
    date: 2026-09-05
  min_short_side_px:
    value: 480
    unit: px
    status: hypothesis
    source: >
      Below this a 450 mm plate spans too few pixels for a reliable Hough
      circle at typical filming distance, which breaks scale calibration.
    date: 2026-09-05

pose:
  min_mean_keypoint_confidence:
    value: 0.60
    unit: ratio
    status: hypothesis
    source: "MediaPipe presence score. Placeholder — R11 is the clip that will set this."
    date: 2026-09-05
  max_interpolated_gap_frames:
    value: 3
    unit: frames
    status: hypothesis
    source: >
      At 30 fps, 3 frames is 100 ms. Interpolating further invents motion
      across a span in which a bar can move several centimetres.
    date: 2026-09-05

calibration:
  competition_plate_diameter_m:
    value: 0.450
    unit: m
    status: fixed
    source: "IWF Technical and Competition Rules — plate outside diameter 450 mm."
    date: 2026-09-05
  barbell_length_m:
    value: 2.20
    unit: m
    status: fixed
    source: "IWF men's bar length 2.20 m. Women's bar is 2.01 m — see note."
    date: 2026-09-05
    note: >
      Using the men's length for a women's bar overstates scale by ~9%, which
      propagates directly into every velocity. Bar length is therefore the
      SECOND calibration choice, never the first, and plate diameter wins
      because 450 mm is the same on both.

view:
  min_confidence:
    value: 0.70
    unit: ratio
    status: hypothesis
    source: "Below this the view is treated as unknown and view-specific rules are disabled."
    date: 2026-09-05

segmentation:
  # Savitzky-Golay over the raw bar trace, BEFORE any velocity is taken.
  # Differentiating an unsmoothed signal amplifies its noise, so a jittery
  # centroid becomes a wildly oscillating velocity and the zero-crossings that
  # define a rep multiply. Window is in frames and must be odd.
  smoothing_window_frames:
    value: 9
    unit: frames
    status: hypothesis
    source: "0.3 s at 30 fps — long enough to kill centroid jitter, short enough to leave a 0.9 s concentric intact."
    date: 2026-09-05
  smoothing_polyorder:
    value: 2
    unit: order
    status: hypothesis
    source: "Quadratic preserves the curvature at a turnaround, which is exactly where a rep boundary sits."
    date: 2026-09-05

  # A rep BEGINS when the bar starts moving, not when the previous one stopped
  # rising. Bounding an excursion by the previous peak puts the eccentric start
  # at the top of the last rep and swallows the lockout whole — a consistent
  # 13-frame error on S01, which is exactly the lockout's length and is what
  # gave it away as structural rather than noise.
  #
  # A fraction of the excursion's own peak speed, so it means the same thing
  # for a fast single and a grinding last rep.
  # Used ONLY to place the pause at the turnaround, which sits inside the
  # excursion where the bar is genuinely moving either side of it. It is no
  # longer used to find where the rep starts and ends — see the entry below for
  # why a velocity test cannot answer that question on real footage.
  motion_onset_velocity_fraction:
    value: 0.08
    unit: ratio_of_peak_speed
    status: hypothesis
    source: "Above the noise floor of a smoothed centroid, below the speed of a deliberate descent."
    date: 2026-09-05

  # HOW FAR THE BAR MUST HAVE LEFT ITS REST POSITION FOR THE MOVEMENT TO BE
  # UNMISTAKABLE, as a fraction of that rep's own range.
  #
  # This does NOT place the rep's boundary. It only reaches a frame that is
  # certainly inside the movement, from which the velocity test walks back to
  # the edge; see `_phases`. The distinction is the entire point of the number,
  # so it is worth being plain about why.
  #
  # A VELOCITY TEST CANNOT CROSS A REST. Both ends of an excursion are bounded
  # by a peak somewhere in the middle of however long the bar sat still, so
  # both have to be walked in across a plateau. Measured on the first real set:
  # across seven seconds of a barbell lying untouched on the floor, the tracked
  # centroid jittered 0.7-1.7 px per frame against an onset floor of 0.96. The
  # test is a coin flip there, so a forward walk stopped on the first noise
  # spike and put the start of a pull 3.4 s before the lifter had touched the
  # bar. Widening the velocity stencil until the noise averaged out needed
  # 0.20 s of frames for 15% of margin, and it cancels at a turnaround, where
  # velocity legitimately passes through zero.
  #
  # A DISPLACEMENT TEST CANNOT PLACE A BOUNDARY. A gate large enough to clear
  # the jitter is reached well after the movement began. Swept as the boundary
  # itself, no value satisfied both clips — G3 wanted <= 0.015 and the real
  # clip wanted >= 0.05 — which said the shape was wrong, not the number.
  #
  # Used only to get inside the movement, it costs nothing in precision, and
  # the sweep goes flat: every value from 0.05 to 0.30 gives an identical
  # 1.0-frame median boundary error on S01 and S02 and identical rep spans on
  # the real clip. 0.10 sits in the middle of that plateau and is roughly four
  # times the jitter band, which was 10 px peak to peak against a 390 px rep.
  left_rest_position_rom_fraction:
    value: 0.10
    unit: ratio_of_rep_rom
    status: hypothesis
    source: >
      Swept 0.01-0.30 against S01, S02 and the first real deadlift set. Flat
      from 0.05 upward on every measure; 0.10 is the middle of that plateau and
      ~4x the 10 px jitter band measured on a 390 px rep.
    date: 2026-09-07

  # What a candidate excursion is measured AGAINST.
  #
  # `min_rom_ratio` is a fraction of a typical rep's range, which is circular —
  # the typical rep is what segmentation is trying to find. Resolved by taking
  # the reference from candidates in the main cluster: those reaching at least
  # this fraction of the largest excursion. A set of real reps clusters near the
  # top; re-grips and shuffles sit far below and cannot drag the reference down.
  #
  # Using the plain median of ALL candidates fails on S02: three real reps and
  # three decoys give a median halfway between them, and the 35% partial then
  # sits within a whisker of the cut.
  rom_reference_fraction_of_max:
    value: 0.5
    unit: ratio_of_max_excursion
    status: hypothesis
    source: "Separates the rep cluster from decoys. S02's decoys are at 0.10, 0.14 and 0.35 of full range."
    date: 2026-09-05

  # HOW LONG THE BAR MAY SIT AT THE REST POSITION AND STILL BELONG TO THE REP
  # IT JUST FINISHED.
  #
  # Phases used to tile the whole clip: every rep's trailing pause ran to the
  # start of the next one, and the last one ran to the final frame. On a
  # synthetic set of back-to-back reps that is invisible, because there is no
  # gap for it to swallow. On a real set it is most of the clip. The first real
  # deadlift set measured here came back as reps of 20.1 s, 9.1 s and 22.4 s
  # against a deadlift rep of 3-5 s, because the nine seconds the lifter spent
  # standing over the bar between two pulls were inside one of them.
  #
  # REST IS NOT A PHASE OF A REP. The tiling assumption was the defect, not the
  # boundary: a pause longer than this is the lifter recovering, and it belongs
  # to no rep at all. Frames between reps are now allowed to belong to nothing.
  max_end_pause_s:
    value: 2.0
    unit: s
    status: hypothesis
    source: >
      A deliberate lockout is well under a second, and a competition deadlift
      is held for a "down" signal of about one. 2 s admits both with margin and
      is far short of any real rest between reps.
    date: 2026-09-07

  # The single most important number in the pipeline: it decides what counts as
  # a rep. Too low and re-grips become reps; too high and a shallow last rep
  # vanishes. S02 exists specifically to pin it down.
  #
  # WHICH WAY THE REP GOES is the other per-exercise fact, and it is not a
  # threshold — it is a statement about the lift, so it carries `status: fixed`
  # like the plate diameter rather than waiting on a sweep.
  #
  # A squat, a bench and a press begin at the top: the bar is lowered, pauses,
  # and is driven back. A DEADLIFT BEGINS ON THE FLOOR, and its first movement
  # is the concentric. Segmentation used to model every lift the first way, so
  # on a deadlift it built each "rep" around the bar's time on the FLOOR — the
  # lowering of one rep, the rest, and the pull of the next, in one span. That
  # is why the rest could not be trimmed out of a rep: it was in the middle of
  # it, not on the end.
  back_squat:
    min_rom_ratio:
      value: 0.55
      unit: ratio_of_median_rep_rom
      status: hypothesis
      source: "Guess. S02's decoys sit at 0.10, 0.14 and 0.35 to bracket it."
      date: 2026-09-05
    cycle: { value: eccentric_first, unit: phase_order, status: fixed, source: "The bar starts racked on the shoulders at standing height; the rep opens with the descent.", date: 2026-09-07 }
  front_squat:
    min_rom_ratio: { value: 0.55, unit: ratio_of_median_rep_rom, status: hypothesis, source: "Mirrors back_squat until evidence separates them.", date: 2026-09-05 }
    cycle: { value: eccentric_first, unit: phase_order, status: fixed, source: "As back_squat — standing start, descent first.", date: 2026-09-07 }
  deadlift:
    min_rom_ratio: { value: 0.60, unit: ratio_of_median_rep_rom, status: hypothesis, source: "Bar starts at rest on the floor; cycle begins with the concentric.", date: 2026-09-05 }
    cycle: { value: concentric_first, unit: phase_order, status: fixed, source: "The bar rests on the floor between reps. The pull is the first movement, and the rep ends with the bar back down.", date: 2026-09-07 }
  bench_press:
    min_rom_ratio: { value: 0.50, unit: ratio_of_median_rep_rom, status: hypothesis, source: "Shorter ROM and more variance than a squat.", date: 2026-09-05 }
    cycle: { value: eccentric_first, unit: phase_order, status: fixed, source: "Arms locked at the start; the bar is lowered to the chest first.", date: 2026-09-07 }
  overhead_press:
    min_rom_ratio: { value: 0.55, unit: ratio_of_median_rep_rom, status: hypothesis, source: "Guess.", date: 2026-09-05 }
    cycle: { value: eccentric_first, unit: phase_order, status: fixed, source: "Rack position is the start of the rep and the bar is dipped before it is driven, so the descent leads.", date: 2026-09-07 }

squat:
  # UNIT CHANGED before any tuning, deliberately. This was `depth_margin_px`,
  # and a pixel margin does not survive a change of camera distance: the same
  # squat filmed from 2 m and 4 m yields different pixel gaps, so a value tuned
  # on one clip is wrong on the next. Hip width is a body-relative scale that is
  # available WITHOUT calibration, which matters because depth must still work
  # on R07 where no plate is in frame.
  #
  # Changed now rather than after Loop C, because a threshold tuned in a unit we
  # intend to abandon is work that has to be thrown away — and worse, it would
  # carry a `tuned` status and a curve into a file where that means "trusted".
  depth_margin_hip_width_ratio:
    value: 0.0
    unit: ratio_of_hip_width
    enabled: true
    status: hypothesis
    source: >
      Hip centre level with knee centre. In image coordinates (+y down) the
      measure `(hip_y - knee_y) / hip_width` trips when it is LESS than 0 — the
      hip is above the knee. 0.0 is "exactly level"; a positive value would
      demand depth past level, a negative one would forgive stopping short.
    date: 2026-09-05
  lumbar_flexion_bottom_deg:
    value: 15.0
    unit: deg
    enabled: false          # no fixture — see manifest coverage_gaps
    status: hypothesis
    source: "Clinical rule-of-thumb for visible bottom-position flexion. No labelled clip exists."
    date: 2026-09-05
  hip_shoot_deg:
    value: 12.0
    unit: deg
    enabled: false          # no fixture — see manifest coverage_gaps
    status: hypothesis
    source: "Torso inclination increase during ascent. No dedicated clip in the golden set."
    date: 2026-09-05
  knee_valgus_hip_width_ratio:
    value: 0.05
    unit: ratio_of_hip_width
    enabled: true
    status: hypothesis
    source: "Front view only. R03 is the fixture."
    date: 2026-09-05

tracking:
  # HOW FAR THE BAR MAY MOVE BETWEEN TWO FRAMES, as a fraction of frame height.
  #
  # This is the number that separates a bar path from a scatter plot. Without
  # it, Hough returns a circle for every frame — a light fitting, a plate on
  # the rack, a fan — and coverage reads 100% while the "path" jumps up to
  # 992 px per frame. On the first real clip that produced 71 reps in 61
  # seconds.
  #
  # 4% of frame height at 60 fps is about 2.6 m/s of bar speed on a 1080-tall
  # frame filmed at a typical distance: far faster than any lift, slow enough
  # to reject a jump across the room.
  max_jump_frame_height_ratio:
    value: 0.04
    unit: ratio_of_frame_height
    status: hypothesis
    source: "Above any real bar speed, below a teleport. Real clip showed median 81px and max 992px jumps without it."
    date: 2026-09-06

  # How long the bar may be lost before the search gives up on continuity and
  # re-acquires from the whole frame. Short: a plate hidden behind a thigh
  # reappears within a few frames, and anything longer is a different shot.
  reacquire_after_frames:
    value: 12
    unit: frames
    status: hypothesis
    source: "0.2 s at 60 fps. Long enough for an occlusion, short enough not to drift onto a new object."
    date: 2026-09-06

  # HOW FAR FROM ITS LAST KNOWN POSITION A RE-ACQUIRED BAR MAY BE, in plate
  # radii. Losing the lock for a fifth of a second does not entitle the search
  # to the whole frame, and giving it the whole frame is how the tracker
  # crossed the room.
  #
  # The specific adversary: a WALL FAN. It is circular, it is the same size as
  # the plate at this camera distance, and its blades move — so it satisfies
  # the circle test, the size test and the motion test simultaneously. The
  # lock sat on the plate at y=1035 for most of the clip and periodically
  # jumped to the fan at y=119, and each 900 px teleport became a rep.
  #
  # What separates them is that the bar was NEARBY a moment ago and the fan
  # never was. At the jump ceiling of 4% of frame height per frame, 12 frames
  # of loss permits about 2 radii of real movement; 3 gives margin for a
  # fast pull and still rules out anything across the room.
  reacquire_radius_plate_radii:
    value: 3.0
    unit: plate_radii
    status: hypothesis
    source: "12 lost frames at the max jump rate is ~2 radii of possible travel. 3 adds margin; the fan sat 5.5 radii away."
    date: 2026-09-06

  # Below this fraction of frames genuinely locked onto the bar, the clip is
  # refused. COVERAGE IS NOT CONFIDENCE — "I found a circle" is not "I found
  # the bar", and reporting the first as the second is what let 71 reps
  # through with no warning.
  min_coherence:
    value: 0.60
    unit: ratio_of_frames
    status: hypothesis
    source: "Placeholder. Needs the real golden set to place properly; deliberately permissive for now."
    date: 2026-09-06

  # HOW FAR FROM THE LIFTER'S TAP THE PLATE MAY BE, as a fraction of frame
  # height. A tap on a phone is worth a few tens of pixels of slop — a
  # fingertip is about 8 mm, aimed at arm's length — but it is not worth the
  # whole frame. Accept a distant circle and the tap stops being ground truth
  # and goes back to being a hint.
  #
  # 5% of 1920 is 96 px: comfortably more than a thumb's imprecision, and far
  # less than the distance to the nearest decoy in any clip seen so far (the
  # wall fan sat ~950 px from the plate).
  seed_tolerance_frame_height_ratio:
    value: 0.05
    unit: ratio_of_frame_height
    status: hypothesis
    source: "96 px on a 1920-tall frame. Larger than a fingertip's error, far smaller than the gap to the nearest decoy."
    date: 2026-09-07

  # A PLATE IS ONE OBJECT AND ONE OBJECT HAS ONE SIZE.
  #
  # Continuity in POSITION alone is not continuity in identity. The jump limit
  # above permits 4% of frame height per frame, which is correct for a bar and
  # also enough to step onto a neighbouring object — and then onto the next.
  # Over 3692 frames the lock walked 104% of frame height sideways while the
  # tracked radius swung from 72 px to 234 px. Nothing objected, because
  # nothing was watching the radius.
  #
  # The camera is static and the plate is rigid, so apparent radius changes
  # only with distance to the lens. A lifter shifting 0.5 m toward or away
  # from a phone 3 m out moves it about 17%. 25% covers that with margin and
  # still rejects an object of a visibly different size.
  max_radius_deviation_ratio:
    value: 0.25
    unit: ratio_of_held_radius
    status: hypothesis
    source: "Geometry: ±0.5 m of depth change at a 3 m camera distance is ~17% apparent size. 25% allows it plus detector noise."
    date: 2026-09-06

  # The held radius is a median over this many recent frames rather than the
  # last value, so one noisy detection cannot drag the size band with it and
  # open the door to the next object along.
  radius_memory_frames:
    value: 15
    unit: frames
    status: hypothesis
    source: "0.25 s at 60 fps. Long enough to be robust to single-frame noise, short enough to follow genuine depth change."
    date: 2026-09-06

  # Across the whole clip, p95/p5 of the tracked radius. Above this the
  # tracker visited objects of different sizes, whatever its coherence says.
  #
  # This exists because coherence did NOT catch the failure it was written to
  # catch: 64% coherence passed a 60% floor on a clip where the tracked radius
  # varied 3.25x. Every frame was continuous with the one before it and the
  # sequence as a whole was still not a barbell.
  max_radius_spread_ratio:
    value: 1.60
    unit: ratio
    status: hypothesis
    source: "Two applications of the 25% per-step band in opposite directions. Measured 3.25x on a clip known to be wrong."
    date: 2026-09-06

  # HOW FAR THE BAR MUST TRAVEL VERTICALLY FOR THE CLIP TO CONTAIN REPS AT
  # ALL, measured in plate radii — the plate is the one object of known size
  # in the frame, so it is the ruler, and a ratio needs no calibration.
  #
  # A competition plate is 450 mm across, so one radius is ~22 cm. Every lift
  # this analyser supports moves the bar considerably further than that: a
  # deadlift is ~55 cm, a squat ~60 cm, a bench ~40 cm. Requiring a single
  # radius therefore refuses only paths that could not be reps, with roughly
  # half a rep of margin.
  #
  # This is the check that catches what the other two cannot. A tracker locked
  # onto a fixture on the wall scores PERFECTLY on coherence and on size
  # stability, because a wall fixture is the most stable thing in the room —
  # measured here as 47.6 s of unbroken lock with 11% of frame height of
  # movement, reported as 4 reps.
  min_travel_plate_radii:
    value: 1.0
    unit: plate_radii
    status: hypothesis
    source: "One radius is ~22 cm on a 450 mm plate; the shortest supported lift (bench) is ~40 cm. Refuses only impossible paths."
    date: 2026-09-06


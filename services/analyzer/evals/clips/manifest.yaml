# Golden set — 15 clips.
#
# Every label here is GROUND TRUTH and the gates are scored against it, so a
# careless label is worse than a missing one: it silently moves the target the
# whole loop is aiming at. Anything not actually known is left null rather than
# guessed, and a clip with null labels is excluded from the gate that needs
# them rather than counted as a pass.
#
# PROVENANCE IS PART OF THE DATA. `labelled_by` and `labelled_on` are required
# on every real clip. When a gate disagrees with a label six iterations from
# now, the first question is always "is the label right", and that is
# unanswerable without knowing who set it and when.
#
# Frame indices are 0-based and refer to the video AFTER ingest normalisation
# (rotation applied, fps unchanged). Label from the normalised file the harness
# writes to evals/clips/normalised/, never from the phone's original, or every
# boundary will be off by the rotation.
#
# Image coordinates: +x right, +y DOWN. "Hip below knee" therefore means the hip
# has a LARGER y than the knee. This trips people up constantly; it is why the
# depth rule's measure reads `hip_y - knee_y`.

schema_version: "0.1.0"

# ---------------------------------------------------------------- synthetic --
#
# Generated by `make synth` from evals/harness/synth.py. Deterministic, seeded,
# and regenerable, so their labels are not opinions — they are the parameters
# the generator was given. They exist to make rep segmentation and phase
# boundaries testable before any real footage is recorded, and to keep the loop
# moving when the golden set is still half-empty.
#
# They are NOT a substitute for real clips. A stick figure has perfect
# keypoints, no clothing, no motion blur and no background: it can prove the
# segmentation maths is right and can prove nothing at all about MediaPipe.

clips:
  - id: S01
    source: synthetic
    file: synthetic/S01_squat_side_clean.mp4
    generator:
      seed: 1001
      fps: 30
      resolution: [1080, 1920]
      reps: 5
      depth_ratio: 1.12          # hip travels 12% past knee level at the bottom
      tempo: { ecc_s: 1.20, bottom_s: 0.20, con_s: 0.90, lockout_s: 0.50 }
      noise_px: 0.0
    exercise: back_squat
    view_requested: side
    view_true: side
    expected_status: ok
    true_rep_count: 5
    # reps: DERIVED from generator by evals/harness/plan.py — see loader._derived_reps
    known_faults: []
    notes: >
      The baseline. Five identical, unambiguous reps with generous depth and no
      faults. If this clip is ever wrong, the fault is in the harness or the
      segmentation maths, never in the footage — which is exactly what makes it
      the first thing to check when a real clip misbehaves.

  - id: S02
    source: synthetic
    file: synthetic/S02_squat_side_partials.mp4
    generator:
      seed: 1002
      fps: 30
      resolution: [1080, 1920]
      reps: 3
      depth_ratio: 0.88          # hip stays 12% ABOVE knee level — shallow
      tempo: { ecc_s: 1.10, bottom_s: 0.15, con_s: 0.85, lockout_s: 0.60 }
      decoys:
        # Movements that are NOT reps and must not be counted. This is the
        # clip that tests the minimum-ROM hysteresis, which is where rep
        # segmentation usually breaks first.
        - { kind: regrip,  at_s: 1.2,  amplitude_ratio: 0.10 }
        - { kind: shuffle, at_s: 8.4,  amplitude_ratio: 0.14 }
        - { kind: partial, at_s: 12.9, amplitude_ratio: 0.35 }
      noise_px: 0.0
    exercise: back_squat
    view_requested: side
    view_true: side
    expected_status: ok
    true_rep_count: 3
    # reps: DERIVED from generator by evals/harness/plan.py — see loader._derived_reps
    known_faults:
      - { rule_id: squat_depth_insufficient, severity: major, reps: [1, 2, 3] }
    notes: >
      Three shallow reps plus three decoy movements that must be rejected. The
      partial at 12.9 s is deliberately 35% of full ROM — close enough to the
      hysteresis boundary to be a real test rather than a formality.

  - id: S03
    source: synthetic
    file: synthetic/S03_lowfps_abstain.mp4
    generator:
      seed: 1003
      fps: 12                    # below the 24 fps floor — must be rejected
      resolution: [1080, 1920]
      reps: 4
      depth_ratio: 1.10
      tempo: { ecc_s: 1.20, bottom_s: 0.20, con_s: 0.90, lockout_s: 0.50 }
      noise_px: 0.0
    exercise: back_squat
    view_requested: side
    view_true: side
    expected_status: insufficient_quality
    expected_quality_reason: fps_below_minimum
    true_rep_count: null         # unknowable to the analyzer, and it must not try
    reps: []
    known_faults: []
    notes: >
      Four perfectly good reps at an unusable frame rate. The clip exists to
      prove the ingest gate fires BEFORE anything downstream gets a chance to
      produce a plausible-looking answer from data too sparse to support it —
      the failure mode the abstain rule exists to prevent.

  # ------------------------------------------------------------------ real --
  #
  # TWELVE STUBS. `file` points at footage that does not exist yet; the harness
  # reports these as `missing_footage` and excludes them from gate denominators.
  # Numbers produced before this footage lands are computed over the three
  # synthetic clips alone and must be read that way.
  #
  # Twelve slots cannot cover five exercises times four views times fourteen
  # rules, so these were chosen to make each GATE measurable rather than to
  # cover the feature matrix evenly. The rules left without a fixture are listed
  # under `coverage_gaps` at the foot of this file — they are gaps by decision,
  # not by oversight, and Loop C must not pretend to tune them.
  #
  # Recording instructions are deliberately specific. A golden set assembled
  # from whatever footage was convenient tests whatever that footage happened to
  # contain, which is rarely what the gates need.

  - id: R01
    source: real
    file: real/R01_squat_side_clean.mp4
    status: missing_footage
    exercise: back_squat
    view_requested: side
    view_true: side
    expected_status: ok
    true_rep_count: null
    reps: []
    known_faults: []
    labelled_by: null
    labelled_on: null
    capture:
      what: "5 back squats, comfortably below parallel, moderate load (~70% 1RM), clean and unhurried."
      camera: "Phone on the floor or a low tripod, 3 m away, LEVEL with the hips, lens perpendicular to the bar path."
      framing: "Whole body plus 30 cm of headroom. Both plates fully visible for the entire set."
      clothing: "Fitted top, shorts or tights. Hip and knee must be visually locatable in every frame."
      lighting: "Even gym lighting. No window directly behind the lifter."
      why: "The reference clip. Everything else is read against how this one behaves, so record it first and record it well."

  - id: R02
    source: real
    file: real/R02_squat_side_depth_contrast.mp4
    status: missing_footage
    exercise: back_squat
    view_requested: side
    view_true: side
    expected_status: ok
    true_rep_count: null
    reps: []
    known_faults:
      - { rule_id: squat_depth_insufficient, severity: major, reps: null }
    labelled_by: null
    labelled_on: null
    capture:
      what: "5 squats: the first 2 clearly below parallel, the last 3 clearly stopping high. Exaggerate the difference."
      camera: "As R01, unchanged between takes."
      why: >
        G2 needs reps that are unambiguously pass and unambiguously fail IN THE
        SAME CLIP, so depth agreement is tested against a within-clip contrast.
        Comparing a good clip to a separate bad one would also be measuring
        every difference in lighting, angle and distance between them.

  - id: R03
    source: real
    file: real/R03_squat_front_valgus.mp4
    status: missing_footage
    exercise: back_squat
    view_requested: front
    view_true: front
    expected_status: ok
    true_rep_count: null
    reps: []
    known_faults:
      - { rule_id: squat_knee_valgus, severity: major, reps: null }
    labelled_by: null
    labelled_on: null
    capture:
      what: "5 squats filmed from the FRONT with a deliberate, visible knee cave on the last 3. Light load — do not chase this under weight."
      camera: "Directly in front, 3 m, level with the hips, square to the lifter."
      why: >
        The only front-view rule in v0.1. It is also the clip that proves view
        classification ROUTES rules correctly: every side-view-only rule must
        stay silent here, and a depth verdict emitted from a front view would be
        a confident answer from a view that cannot support it.

  - id: R04
    source: real
    file: real/R04_deadlift_side_clean.mp4
    status: missing_footage
    exercise: deadlift
    view_requested: side
    view_true: side
    expected_status: ok
    true_rep_count: null
    reps: []
    known_faults: []
    labelled_by: null
    labelled_on: null
    capture:
      what: "5 conventional deadlifts, bar returned fully to the floor between reps, moderate load."
      camera: "As R01, but the bar's resting position and the mid-foot must both be clearly visible."
      why: >
        Deadlift rep boundaries are structurally different: the bar starts at
        rest on the floor, so the cycle begins with the CONCENTRIC. Segmentation
        that assumes an eccentric-first cycle passes every squat clip and fails
        here, and nowhere else in the set would catch it.

  - id: R05
    source: real
    file: real/R05_deadlift_side_rounding.mp4
    status: missing_footage
    exercise: deadlift
    view_requested: side
    view_true: side
    expected_status: ok
    true_rep_count: null
    reps: []
    known_faults:
      - { rule_id: deadlift_spine_flexion_change, severity: unsafe, reps: null }
    labelled_by: null
    labelled_on: null
    capture:
      what: >
        3-5 deadlifts with visible upper-back rounding that increases through
        the set. LIGHT LOAD, done deliberately and carefully. Do not injure
        yourself for a test fixture — if this cannot be recorded safely, say so
        and we decide what to do about G4 openly.
      camera: "As R04. The spine line must be readable, so a fitted top is essential."
      why: >
        The only `unsafe` fixture in the set and therefore the whole of G4's
        numerator. Without it, the gate that protects against missing a
        dangerous rep is unmeasurable — which is a decision to take in the open,
        not a gap to leave quiet.

  - id: R06
    source: real
    file: real/R06_bench_side_partial.mp4
    status: missing_footage
    exercise: bench_press
    view_requested: side
    view_true: side
    expected_status: ok
    true_rep_count: null
    reps: []
    known_faults:
      - { rule_id: bench_partial_rom, severity: major, reps: null }
    labelled_by: null
    labelled_on: null
    capture:
      what: "6 bench presses: 3 touching the chest, 3 stopping clearly short."
      camera: "Side on, level with the bench, 2.5 m. Bar and both elbows in frame at the bottom."
      why: >
        Bench is performed lying down, so the vertical torso reference every
        squat rule assumes is simply absent. This is the clip that surfaces
        hidden assumptions about which way 'up' is.

  - id: R07
    source: real
    file: real/R07_squat_side_uncalibrated.mp4
    status: missing_footage
    exercise: back_squat
    view_requested: side
    view_true: side
    expected_status: ok
    true_rep_count: null
    reps: []
    known_faults: []
    expected_calibration_method: none
    labelled_by: null
    labelled_on: null
    capture:
      what: "5 goblet or dumbbell squats — deliberately NO barbell plate anywhere in frame."
      camera: "As R01."
      why: >
        Forces the no-calibration path. Angles must still be produced; every
        velocity and displacement output must be suppressed and
        `calibration_method` must read `none`. A silent fallback to a guessed
        scale is precisely the failure this clip exists to catch, and it is
        invisible in any clip where a plate happens to be present.

  - id: R08
    source: real
    file: real/R08_squat_45deg.mp4
    status: missing_footage
    exercise: back_squat
    view_requested: side
    view_true: "45"
    expected_status: ok
    true_rep_count: null
    reps: []
    known_faults: []
    labelled_by: null
    labelled_on: null
    capture:
      what: "5 squats filmed from roughly 45 degrees — halfway between front and side."
      camera: "3 m away, level with the hips, at 45 degrees to the bar."
      why: >
        `view_requested` and `view_true` DISAGREE by design. The analyzer must
        detect 45, warn that it contradicts the request, and disable the rules
        that are side-view-only. Nothing else in the set tests that
        contradiction, and in the field it will be common — people film from
        wherever there is room.

  - id: R09
    source: real
    file: real/R09_squat_side_longset.mp4
    status: missing_footage
    exercise: back_squat
    view_requested: side
    view_true: side
    expected_status: ok
    true_rep_count: null
    reps: []
    known_faults:
      - { rule_id: velocity_loss_fatigue, severity: minor, reps: null }
      - { rule_id: rom_inconsistency, severity: minor, reps: null }
    labelled_by: null
    labelled_on: null
    capture:
      what: "10-12 squats taken close to failure, so the last reps are visibly slower and shallower than the first."
      camera: "As R01. A plate must stay visible throughout — the velocity rule needs calibration."
      why: >
        The only clip that reaches the SET-level second pass. Those two rules
        cannot fire on a 5-rep clip with even tempo, so without this footage
        they are not merely untuned — they are never executed at all, which is
        how a rule ships broken. It is also the only source of `minor` findings,
        making it the whole of G5's denominator.

  - id: R10
    source: real
    file: real/R10_dark_abstain.mp4
    status: missing_footage
    exercise: back_squat
    view_requested: side
    view_true: side
    expected_status: insufficient_quality
    expected_quality_reason: low_keypoint_confidence
    true_rep_count: null
    reps: []
    known_faults: []
    labelled_by: null
    labelled_on: null
    capture:
      what: "5 squats in a badly underlit corner, or backlit against a bright window so the lifter is a silhouette."
      camera: "As R01, but let the exposure fail. It should be genuinely hard for a PERSON to locate the knee."
      why: >
        MUST ABSTAIN (1 of 3). Pose confidence collapses and every downstream
        number becomes fiction. The reason must be `low_keypoint_confidence`
        specifically, not a generic failure — the user needs to be told to fix
        the light, and a wrong reason sends them to re-shoot the wrong thing.

  - id: R11
    source: real
    file: real/R11_occluded_abstain.mp4
    status: missing_footage
    exercise: back_squat
    view_requested: side
    view_true: side
    expected_status: insufficient_quality
    expected_quality_reason: subject_occluded
    true_rep_count: null
    reps: []
    known_faults: []
    labelled_by: null
    labelled_on: null
    capture:
      what: "5 squats with a rack upright, bench or another person between the camera and the lifter for most of the set, hiding the hip."
      camera: "As R01, but deliberately place the obstruction in the line of sight."
      why: >
        MUST ABSTAIN (2 of 3). Materially different from R10: here the keypoints
        are confidently WRONG rather than uncertain. Low confidence is easy to
        detect; a hip landmark placed firmly on a rack upright is not, and it is
        the failure most likely to produce a confident wrong verdict.

  - id: R12
    source: real
    file: real/R12_twopeople_abstain.mp4
    status: missing_footage
    exercise: back_squat
    view_requested: side
    view_true: side
    expected_status: insufficient_quality
    expected_quality_reason: multiple_subjects
    true_rep_count: null
    reps: []
    known_faults: []
    labelled_by: null
    labelled_on: null
    capture:
      what: "5 squats with a second person clearly visible and moving in frame throughout — a spotter standing close behind is ideal."
      camera: "As R01."
      why: >
        MUST ABSTAIN (3 of 3). Multiple people are out of scope for v0.1 and the
        analyzer must say so rather than analysing whichever body it locked
        onto. The dangerous outcome here is not an error message — it is a
        confident, plausible analysis of the wrong person.

# Rules with no fixture in the golden set. These are gaps BY DECISION: twelve
# real slots cannot cover fourteen rules across five exercises, and spreading
# the footage thinner would have left the gates themselves unmeasurable.
#
# Loop C must not tune a rule listed here. With no labelled positives there is
# no precision/recall curve to place an operating point on, and a threshold
# "confirmed" against zero examples is a number with a date on it and nothing
# behind it. Each ships `hypothesis` until footage exists.
coverage_gaps:
  - rule_id: squat_hip_shoot
    reason: "No dedicated fixture. May be labelled opportunistically on R01/R02 if it occurs."
  - rule_id: squat_lumbar_flexion_bottom
    reason: "No dedicated fixture. Needs a squat-specific rounding clip, deliberately not recorded under load."
  - rule_id: press_lumbar_extension
    reason: "overhead_press has no clip at all in v0.1's golden set."
  - rule_id: bench_elbow_flare
    reason: "R06 covers bench ROM only; flare needs a front or 45 view of a bench press."
  - rule_id: lateral_asymmetry
    reason: "Needs a front or rear view with a genuine left/right difference."
  - rule_id: deadlift_bar_away_at_breakaway
    reason: "R04/R05 may show it incidentally; no clip is shot to produce it."
  - rule_id: bar_horizontal_drift
    reason: "Measurable on any calibrated clip, but no clip has a LABELLED drift value to score against."
  - rule_id: dropped_eccentric
    reason: "No clip is recorded with a deliberately dropped eccentric."
  - exercise: front_squat
    reason: "Supported by the rule set but has no fixture; shares squat thresholds, which risks overfitting them to back-squat geometry."

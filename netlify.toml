# Netlify build for the web app.
#
# Connect the repository once in the Netlify UI and every push to main deploys.
# Nothing here is secret: the only variable is the API's public URL.
#
# ── WHEN CONNECTING THE REPO ────────────────────────────────────────────────
#
# Netlify will offer a "Project to deploy" dropdown listing the four
# workspaces. **Choose "Other (configure manually)".**
#
# Picking `apps/mobile` is not wrong about which app it is — it is the only
# deployable web target, since @fi/api goes to Render and @fi/domain and
# @fi/shared are libraries. But choosing it sets Netlify's BASE DIRECTORY to
# apps/mobile, and then the publish path below (`apps/mobile/web-build`) is
# resolved relative to that base and points at a directory that does not exist.
# Netlify's summary panel shows the mismatch as "Published to: web-build".
#
# Leaving the base at the repository root is also what the build actually
# needs: apps/mobile depends on @fi/shared and @fi/domain through the pnpm
# workspace, which only resolves from the root.
#
# ── HEADERS ─────────────────────────────────────────────────────────────────
#
# The security headers and dynamic-route rewrites are deliberately NOT here.
# They are generated into `_headers` and `_redirects` by the build, because the
# Content-Security-Policy carries a hash of the bundle it ships with — see
# apps/mobile/scripts/write-web-headers.mjs. Netlify reads both files from the
# publish directory, so the generated policy cannot drift from the bundle the
# way a hand-written copy in here would.

[build]
  # Set EXPLICITLY, and it has to be.
  #
  # Leaving it unset does not default to the repository root — it defaults to
  # whatever the UI's "Project to deploy" picker last set, which for this repo
  # was `apps/mobile`. `publish` is then resolved relative to that, producing
  # `apps/mobile/apps/mobile/web-build` and a deploy that fails on a directory
  # that never existed.
  #
  # netlify.toml wins over the UI — the failing build's own log showed
  # `commandOrigin: config` and `publishOrigin: config` — so pinning it here
  # settles the question rather than leaving it to whatever was clicked once.
  base = "."
  publish = "apps/mobile/web-build"
  command = "corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @fi/mobile build:web"

[build.environment]
  # Matches .node-version and the CI runner, so a build here cannot pass on a
  # Node version the rest of the project never uses.
  NODE_VERSION = "24.11.1"
  # Corepack takes the pnpm version from `packageManager` in the root
  # package.json, so it is pinned in one place rather than two.
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"

# NODE_ENV is deliberately NOT set to development here.
#
# The reason it would have been — Netlify defaults to production and Expo's
# export needs devDependencies — is already handled by `--prod=false` on the
# install above. And it is not needed to get a production bundle: exporting
# with and without NODE_ENV=development was measured and produced a
# byte-identical 3,212 KB bundle, because `expo export` sets its own mode.
# Leaving it out keeps the signal honest.

# A pull request gets its own URL, still pointed at the production API. That is
# deliberate for a trial: there is no staging API, and a preview that cannot
# sign in is not a preview.
#
# Each preview origin differs and CORS will refuse it until that origin is added
# to CORS_ORIGINS on the API. That is the correct default — an allowlist that
# quietly admits every deploy preview admits anyone who opens a pull request.

# NFR-M-05 / NFR-D-04: typecheck, lint and tests on every pull request. A red
# build cannot reach staging.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The unit job needs no database; the integration job overrides this.
  NODE_VERSION: '20'

jobs:
  quality:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and contract tests
        run: pnpm test

      - name: Domain coverage must stay at 100% (NFR-M-04)
        run: pnpm --filter @fi/domain test:coverage

      - name: API builds
        run: pnpm --filter @fi/api build

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # The schema needs citext and pg_trgm, both in the official image.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run integration suites against a real Postgres
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitness_test
        run: pnpm vitest run

  cors:
    name: CORS allowlist behaviour (NFR-C-10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Assert allowed and disallowed origins behave differently
        working-directory: apps/api
        run: pnpm vitest run tests/cors.test.ts

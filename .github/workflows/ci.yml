# NFR-M-05 / NFR-D-04: typecheck, lint and tests on every pull request. A red
# build cannot reach staging.
#
# Two things here are deliberate and easy to break by "tidying":
#
# 1. `pnpm/action-setup` has NO `version:` input. The version comes from the
#    `packageManager` field in package.json. Specifying both makes the action
#    fail outright — "Multiple versions of pnpm specified" — which is exactly
#    how this workflow was broken in every job on every run.
#
# 2. Node comes from `.node-version`, the same file Render reads, rather than a
#    literal here. CI was testing Node 20 while production ran 24; a version
#    written in two places is a version that will disagree.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` — see the note at the top of this file.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatting
        # Reports only. The repo predates Prettier being enforced, so failing
        # the build on it would block every change until a mass reformat —
        # which would bury real diffs. Enforce it once the backlog is cleared.
        continue-on-error: true
        run: pnpm format:check

      - name: Unit and contract tests
        # No TEST_DATABASE_URL here, so the integration suites skip by design
        # and this job stays fast. The `integration` job below runs them.
        run: pnpm test

      - name: Domain coverage must stay at 100% (NFR-M-04)
        run: pnpm --filter @fi/domain test:coverage

      - name: API builds
        run: pnpm --filter @fi/api build

  security:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Advisories in production dependencies
        # A new advisory can land in a transitive dependency on any given day,
        # through no change of ours. Failing the build on that would mean a red
        # main branch caused by someone else's publish, so this reports and does
        # not block. Read it; do not ignore it.
        continue-on-error: true
        run: pnpm audit --audit-level moderate

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # The schema needs citext and pg_trgm; migration 0000 creates both, and
        # the official image ships them.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run integration suites against a real Postgres
        working-directory: apps/api
        env:
          # These suites TRUNCATE every table in this database. It is a
          # throwaway service container, which is the only safe kind of target.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitness_test
        run: pnpm vitest run

  cors:
    name: CORS allowlist behaviour (NFR-C-10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Assert allowed and disallowed origins behave differently
        # Also covered by `quality`, kept as its own check so the CORS
        # requirement is visible by name in the checks list. NFR-C-01 makes a
        # wildcard origin undeployable; this is what proves it still is.
        working-directory: apps/api
        run: pnpm vitest run tests/cors.test.ts

  web:
    name: Web build and host config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The web app is a shipped target, not a side effect, so a change that
      # breaks the browser build should fail here rather than on Netlify.
      - name: Build for web
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://fitnellisense.onrender.com
        run: pnpm build:web

      # The CSP allows exactly one inline script, by hash. If Expo changes that
      # bootstrap and the hash is not regenerated, the deployed app is a blank
      # white page — a failure no unit test would ever catch. This asserts the
      # generated policy actually matches the bundle beside it.
      - name: Assert the CSP matches the bundle it shipped with
        working-directory: apps/mobile
        run: node scripts/check-web-headers.mjs web-build
